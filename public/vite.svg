<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Dark Medical Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081A2E" />
      <stop offset="100%" stop-color="#040D18" />
    </linearGradient>

    <!-- Medical Primary Glow Gradient -->
    <linearGradient id="medGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#00A3FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Laser Scanner Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#medGlow)" stroke-width="14" stroke-opacity="0.85" />

  <!-- Inner Ambient Aura -->
  <circle cx="256" cy="256" r="160" fill="#00E5FF" opacity="0.08" filter="url(#glow)" />

  <!-- Medical Cross Geometry -->
  <!-- Vertical Bar -->
  <rect x="216" y="112" width="80" height="288" rx="28" fill="url(#crossGrad)" filter="url(#subtleGlow)" />
  <!-- Horizontal Bar -->
  <rect x="112" y="216" width="288" height="80" rx="28" fill="url(#crossGrad)" filter="url(#subtleGlow)" />

  <!-- Central Optical Reticle Circle -->
  <circle cx="256" cy="256" r="92" fill="#06192A" stroke="#00F0FF" stroke-width="8" stroke-dasharray="14 10" />

  <!-- Core Reticle / Skin Target -->
  <circle cx="256" cy="256" r="54" fill="#0A2239" stroke="#38BDF8" stroke-width="6" />

  <!-- Scanning Reticle Crosshairs -->
  <line x1="256" y1="184" x2="256" y2="204" stroke="#00FFFF" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="308" x2="256" y2="328" stroke="#00FFFF" stroke-width="5" stroke-linecap="round" />
  <line x1="184" y1="256" x2="204" y2="256" stroke="#00FFFF" stroke-width="5" stroke-linecap="round" />
  <line x1="308" y1="256" x2="328" y2="256" stroke="#00FFFF" stroke-width="5" stroke-linecap="round" />

  <!-- Modern Corner Scanner Brackets -->
  <!-- Top-Left -->
  <path d="M 170 190 L 170 170 L 190 170" fill="none" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top-Right -->
  <path d="M 342 190 L 342 170 L 322 170" fill="none" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Left -->
  <path d="M 170 322 L 170 342 L 190 342" fill="none" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-Right -->
  <path d="M 342 322 L 342 342 L 322 342" fill="none" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Laser Scan Wave Beam -->
  <line x1="120" y1="256" x2="392" y2="256" stroke="url(#laserGrad)" stroke-width="6" stroke-linecap="round" />

  <!-- Central AI Core Sparkle -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" filter="url(#subtleGlow)" />
  <circle cx="256" cy="256" r="7" fill="#00E5FF" />

  <!-- Accent AI Sparkle -->
  <path d="M 374 122 L 378 136 L 392 140 L 378 144 L 374 158 L 370 144 L 356 140 L 370 136 Z" fill="#00F0FF" />
</svg>